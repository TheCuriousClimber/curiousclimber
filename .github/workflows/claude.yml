name: Claude (on-demand)

# On-demand content help. Mention @claude in an issue, an issue comment, a PR
# review, or a PR review comment and Claude will act on that thread and open /
# update a pull request. Nothing is committed to main directly — review-gated.
#
# Requires (one-time, done by the repo owner):
#   1. Install the Claude GitHub app on this repo.
#   2. Add repo secret ANTHROPIC_API_KEY.
# Until both exist, the job simply fails on the mention (no silent changes).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only spend minutes when someone actually mentions @claude.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Guardrails for this repo. Claude may draft/edit content and open PRs,
          # but must not touch pricing/checkout or push straight to main.
          claude_args: |
            --append-system-prompt "This is a static GitHub Pages site (no build step). Follow articles/README.md for any article work. NEVER change pricing, product config, checkout wiring (assets/js/site.js GUMROAD_* block), or legal/PAR-Q pages — flag those for the owner instead. Propose all changes as a pull request; never push to main directly."
