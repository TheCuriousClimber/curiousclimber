name: Deploy to GitHub Pages

# Publishes the repository as a static site to GitHub Pages. The site is plain
# HTML/CSS/JS with no build step, so the whole repo root is uploaded as-is —
# this serves the existing site at the root and the standalone shop at
# /autobody-shop/, exactly like "Deploy from a branch → main → / (root)".
#
# ONE-TIME SETUP: in the repo, go to Settings → Pages → Build and deployment →
# Source → "GitHub Actions". After that, every push to `main` deploys here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
